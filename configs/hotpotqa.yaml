# Reference configuration for the final HotpotQA pipeline.
# The current command-line scripts use explicit flags; this file records the
# frozen defaults and artifact names used by Readme.md.

experiment: hotpotqa_contribution_flow_final
seed: 20260711

data:
  input: /data1/yujia/RAGData/hotpotqa-exp/results/retrieval_hotpotqa_vdb_nested_top10_1000.jsonl
  start: 0
  count: 1000
  replacement_pool_chunks: 10
  evaluation_chunks: 5

reader:
  backend: vllm_openai_compatible
  model_path: /data1/yujia/models/Qwen2.5-7B-Instruct
  served_model: qwen2.5-7b
  base_url: http://127.0.0.1:8000/v1
  dtype: bfloat16
  decoding: greedy
  max_new_tokens: 96
  workers: 16

annotation:
  spacy_model: en_core_web_lg
  base_url: http://127.0.0.1:8021

contribution_graph:
  backend: huggingface_sdpa_layerwise_attention_recompute
  method: answer_conditioned_closed_positive_message_flow
  target_objective: mean_answer_logit
  context_truncation: none
  sequence_limit: model_context_window
  max_receivers_per_layer: 48
  token_contraction: surface_position

optimization:
  capacity_normalization: mean-positive-edge
  solver: exact-supported-breakpoint-flow-contract

replacement:
  mode: frozen_shared_top10_pool
  seed: 0
  deletion_allowed: false
  require_single_token: true
  require_contextual_pos: true
  require_contextual_tag: true
  require_contextual_morphology: true
  entity_policy: same_type_same_length_same_slot

evaluation:
  population: all_1000_queries
  baseline_budget: matched_reflow_terminal_set
  final_backend: vllm_openai_compatible
  reader_workers: 16

artifacts:
  root: /data1/yujia/CausalityRAG/out/hotpotqa
  token_units: inputs/token_units_top10_1000.jsonl
  clean_targets: inputs/clean_reference_top5_1000.jsonl
  replacement_pool: replacements/shared_pool_top10_v1/shared_pool.jsonl
  contribution_graph: graphs/contribution_graph_top5_1000.jsonl
  frontier: methods/reflow/frontier_top5_1000.jsonl
  results: methods/reflow/results_top5_1000.jsonl
  manifest: manifest.json
